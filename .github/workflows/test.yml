name: Extension and Windows installer checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
      - run: python scripts/build_visual_guide.py
      - run: python scripts/build_visual_installer.py
      - run: python -m unittest discover -s tests -p test_visual_installer.py -q
      - uses: actions/upload-artifact@v4
        with:
          name: oci-companion-windows-installer
          path: dist/windows-visual-r16/
          retention-days: 7
